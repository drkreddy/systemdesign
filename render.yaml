# Lives at the repository root because that is the only place Render looks for a
# Blueprint — it cannot be nested under labs/cdn/ even though that is where the
# project it describes actually lives.
#
# Origin is placed in Oregon on purpose. Measuring from India, that is roughly
# 13,000 km each way — ~220ms of round-trip propagation delay that no amount of
# server tuning can remove. Erasing that gap is what Module 2 demonstrates.
services:
  - type: web
    name: cdn-lab-origin
    runtime: node
    plan: free
    region: oregon
    rootDir: labs/cdn/origin
    buildCommand: npm install
    startCommand: node server.js
    # Render's own health checks also double as a partial keepalive, though on
    # the free plan the service still idles out after ~15 minutes without
    # external traffic. A cron trigger on the play worker keeps it awake.
    healthCheckPath: /health
    envVars:
      - key: ORIGIN_REGION
        value: oregon
      # Gates the endpoints that change shared state (/stats/reset, /api/toggle).
      # sync: false means the value is set in the Render dashboard and never
      # committed — this repository is public. If it is left unset those
      # endpoints stay disabled, which is the safe failure direction.
      - key: ORIGIN_SECRET
        sync: false
